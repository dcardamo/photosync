name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test -p photosync-core -p photosync-status -p photosync-cli
      - name: Clippy
        run: cargo clippy -p photosync-core -p photosync-status -p photosync-cli --all-targets -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Type and Svelte check
        working-directory: app
        run: npm run check
      - name: Unit tests
        working-directory: app
        run: npm test
      - name: Build the frontend
        working-directory: app
        run: npm run build

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Syncthing 2.1.3
        env:
          VERSION: 2.1.3
          SHA256: f929eb8e5b72a85543eeeefb2c38f34a68e0c530e70758a2905b78840c76602c
        run: |
          curl -sSfL -o syncthing.tgz \
            "https://github.com/syncthing/syncthing/releases/download/v${VERSION}/syncthing-linux-amd64-v${VERSION}.tar.gz"
          echo "${SHA256}  syncthing.tgz" | sha256sum -c -
          tar -xzf syncthing.tgz
          echo "$PWD/syncthing-linux-amd64-v${VERSION}" >> "$GITHUB_PATH"
      - name: Two-instance facts and release-gate faults
        run: cargo test -p photosync-status --test live -- --ignored --test-threads=1
        timeout-minutes: 15

  android:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install NDK and Tauri CLI
        env:
          NDK_VERSION: 27.2.12479018
          TAURI_CLI_VERSION: 2.11.4
          TAURI_CLI_SHA256: 6864602a34292aa6f2ad40ae019eebe5c1064d6c623fe20696a8a8974067e60b
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          curl -sSfL -o cargo-tauri.tgz \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          echo "${TAURI_CLI_SHA256}  cargo-tauri.tgz" | sha256sum -c -
          tar -xzf cargo-tauri.tgz -C "$HOME/.cargo/bin" cargo-tauri
      - name: Build the emulator APK
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          cargo tauri android build --debug --apk --target x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          retention-days: 3
