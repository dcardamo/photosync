[workspace]
resolver = "2"
members = ["crates/core", "crates/status-server", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/dcardamo/photosync"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
globset = "0.4.18"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "time", "sync", "macros"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
walkdir = "2.5.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
